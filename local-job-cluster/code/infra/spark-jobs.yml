apiVersion: v1
kind: Namespace
metadata:
  name: spark-jobs
---
# The driver of each run uses this account to create its executor pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: spark-jobs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-driver
  namespace: spark-jobs
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "persistentvolumeclaims"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-driver
  namespace: spark-jobs
subjects:
- kind: ServiceAccount
  name: spark
  namespace: spark-jobs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spark-driver
---
# Spark UI at localhost:4040 of the running job's driver.
apiVersion: v1
kind: Service
metadata:
  name: spark-driver-ui
  namespace: spark-jobs
spec:
  type: NodePort
  selector:
    spark-role: driver
  ports:
  - port: 4040
    targetPort: 4040
    nodePort: 30040
---
# Spark History Server at localhost:18080: the Spark UI of every job, running or finished,
# rebuilt from the event logs in spark-events/.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-history-server
  namespace: spark-jobs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-history-server
  template:
    metadata:
      labels:
        app: spark-history-server
    spec:
      nodeSelector:
        spark-node: driver  # where spark-events/ is mounted
      containers:
      - name: history-server
        image: spark-with-delta:4.1.3
        imagePullPolicy: Never
        command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.history.HistoryServer"]
        env:
        - name: SPARK_HISTORY_OPTS
          value: -Dspark.history.fs.logDirectory=file:///spark-events
        volumeMounts:
        - name: events
          mountPath: /spark-events
      volumes:
      - name: events
        hostPath:
          path: /spark-events
---
apiVersion: v1
kind: Service
metadata:
  name: spark-history-server
  namespace: spark-jobs
spec:
  type: NodePort
  selector:
    app: spark-history-server
  ports:
  - port: 18080
    targetPort: 18080
    nodePort: 30080
