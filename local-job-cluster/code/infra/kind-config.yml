# Run `kind create cluster` from the local-job-cluster/ folder: kind resolves the
# relative hostPaths below from the current directory.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
# Kubernetes itself; no Spark pods run here.
- role: control-plane
  extraPortMappings:
  - containerPort: 30040  # Spark UI of the running job
    hostPort: 4040
  - containerPort: 30080  # Spark History Server
    hostPort: 18080
# Driver node: jobs place drivers on nodes labeled spark-node=driver.
- role: worker
  labels:
    spark-node: driver
  extraMounts:
  - hostPath: ./code/app  # job code
    containerPath: /opt/app
    readOnly: true
  - hostPath: ./spark-events  # event logs for the History Server
    containerPath: /spark-events
# Worker nodes: executors go on nodes labeled spark-node=worker.
- role: worker
  labels:
    spark-node: worker
  extraMounts:
  - hostPath: ./code/app
    containerPath: /opt/app
    readOnly: true
- role: worker
  labels:
    spark-node: worker
  extraMounts:
  - hostPath: ./code/app
    containerPath: /opt/app
    readOnly: true
